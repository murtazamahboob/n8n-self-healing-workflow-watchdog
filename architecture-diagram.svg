<svg viewBox="0 0 1400 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="480" fill="#0d1117"/>

  <!-- Title -->
  <text x="700" y="40" fill="#e6edf3" font-size="22" font-weight="bold" text-anchor="middle">Self-Healing Workflow Watchdog — Architecture</text>

  <!-- Watched workflow row -->
  <text x="30" y="90" fill="#8b949e" font-size="13" font-weight="bold">ANY OTHER WORKFLOW (dental bot, real estate agent, etc.)</text>
  <rect x="30" y="105" width="200" height="60" rx="10" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="130" y="130" fill="#e6edf3" font-size="14" text-anchor="middle">Something</text>
  <text x="130" y="148" fill="#f85149" font-size="14" text-anchor="middle" font-weight="bold">fails ❌</text>

  <line x1="230" y1="135" x2="290" y2="135" stroke="#f85149" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="120" fill="#8b949e" font-size="11" text-anchor="middle">Error Workflow</text>
  <text x="260" y="150" fill="#8b949e" font-size="11" text-anchor="middle">setting</text>

  <!-- Watchdog pipeline -->
  <text x="300" y="90" fill="#8b949e" font-size="13" font-weight="bold">WATCHDOG WORKFLOW</text>

  <!-- Error Trigger -->
  <rect x="300" y="105" width="150" height="60" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="375" y="130" fill="#e6edf3" font-size="13" text-anchor="middle">Error Trigger</text>
  <text x="375" y="148" fill="#8b949e" font-size="11" text-anchor="middle">catches the failure</text>

  <line x1="450" y1="135" x2="500" y2="135" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Extract Context -->
  <rect x="500" y="105" width="150" height="60" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="575" y="126" fill="#e6edf3" font-size="13" text-anchor="middle">Extract Error</text>
  <text x="575" y="144" fill="#e6edf3" font-size="13" text-anchor="middle">Context</text>

  <line x1="650" y1="135" x2="700" y2="135" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LLM Chain -->
  <rect x="700" y="105" width="170" height="60" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  <text x="785" y="126" fill="#e6edf3" font-size="13" text-anchor="middle">AI Diagnosis</text>
  <text x="785" y="144" fill="#e6edf3" font-size="13" text-anchor="middle">(LLM Chain)</text>

  <!-- OpenAI sub-node -->
  <rect x="720" y="220" width="130" height="55" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="785" y="243" fill="#e6edf3" font-size="12" text-anchor="middle">OpenAI Chat</text>
  <text x="785" y="259" fill="#e6edf3" font-size="12" text-anchor="middle">Model</text>
  <line x1="785" y1="220" x2="785" y2="165" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowPurple)"/>
  <text x="800" y="200" fill="#8b949e" font-size="10">"brain"</text>

  <line x1="870" y1="135" x2="920" y2="135" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Parse -->
  <rect x="920" y="105" width="150" height="60" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="995" y="126" fill="#e6edf3" font-size="13" text-anchor="middle">Parse AI</text>
  <text x="995" y="144" fill="#e6edf3" font-size="13" text-anchor="middle">Diagnosis</text>

  <line x1="1070" y1="135" x2="1120" y2="135" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Telegram -->
  <rect x="1120" y="105" width="150" height="60" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="1195" y="126" fill="#e6edf3" font-size="13" text-anchor="middle">Telegram:</text>
  <text x="1195" y="144" fill="#3fb950" font-size="13" text-anchor="middle" font-weight="bold">Diagnosis + Fix ✅</text>

  <line x1="1195" y1="165" x2="1195" y2="220" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Google Sheets -->
  <rect x="1120" y="220" width="150" height="60" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="1195" y="245" fill="#e6edf3" font-size="13" text-anchor="middle">Log to</text>
  <text x="1195" y="263" fill="#e6edf3" font-size="13" text-anchor="middle">Google Sheets</text>

  <!-- Output description box -->
  <rect x="300" y="340" width="970" height="110" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="320" y="365" fill="#e6edf3" font-size="13" font-weight="bold">What the person receives on Telegram, in seconds:</text>
  <text x="320" y="390" fill="#8b949e" font-size="12">Workflow name · Failed step · Severity (LOW/MEDIUM/HIGH) · Category (auth, rate limit, bad data, timeout...)</text>
  <text x="320" y="410" fill="#8b949e" font-size="12">Plain-English explanation of what went wrong</text>
  <text x="320" y="430" fill="#8b949e" font-size="12">2–4 concrete, numbered steps to fix it — written for a non-technical reader</text>

  <!-- Arrow marker defs -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#a371f7"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3fb950"/>
    </marker>
  </defs>
</svg>
